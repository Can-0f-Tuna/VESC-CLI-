[package]
name = "veac"
version = "0.1.0"
edition = "2021"
description = "AI-controllable CLI for VESC motor controllers"
authors = ["VESC CLI Contributors"]
license = "GPL-3.0"
repository = "https://github.com/vedderb/vesc_cli"
homepage = "https://github.com/vedderb/vesc_cli"
readme = "README.md"
keywords = ["vesc", "motor", "cli", "automation", "robotics"]
categories = ["command-line-utilities", "hardware-support", "science::robotics"]
rust-version = "1.70"

[[bin]]
name = "veac"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
tokio-serial = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
crc16 = "0.4"
tabled = "0.16"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
